<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cálculo de Média</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="neutro">
  <main class="cartao">
    <header class="topo">
      <div class="icone">📝</div>
      <h1>CÁLCULO DE MÉDIA</h1>
    </header>
    <section class="conteudo">
      <form action="/media" method="get">
        <label>Nota P1
          <input type="text" name="p1" placeholder="Ex.: 7.5" inputmode="decimal">
        </label>
        <label>Nota P2
          <input type="text" name="p2" placeholder="Ex.: 5.0" inputmode="decimal">
        </label>
        <button type="submit">Calcular</button>
      </form>
    </section>
  </main>
</body>
</html>
